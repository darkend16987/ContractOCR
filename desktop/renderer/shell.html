<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nabu PDF — tabs</title>
    <style>
      :root {
        --bg: #0f172a;
        --strip: #0b1222;
        --tab: #1e293b;
        --tab-active: #334155;
        --tab-hover: #273449;
        --fg: #cbd5e1;
        --fg-dim: #94a3b8;
        --border: #1f2b40;
        --accent: #f59e0b;
      }
      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--strip);
        color: var(--fg);
        font: 12px/1.2 -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #bar {
        display: flex;
        align-items: stretch;
        height: 40px;
        gap: 4px;
        padding: 6px 6px 0 6px;
      }
      #tabs {
        display: flex;
        align-items: stretch;
        gap: 4px;
        flex: 1 1 auto;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: thin;
      }
      #tabs::-webkit-scrollbar {
        height: 4px;
      }
      #tabs::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 2px;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 1 200px;
        min-width: 90px;
        max-width: 240px;
        padding: 0 8px 0 12px;
        height: 34px;
        background: var(--tab);
        border: 1px solid var(--border);
        border-bottom: none;
        border-radius: 8px 8px 0 0;
        cursor: default;
        color: var(--fg-dim);
        white-space: nowrap;
        overflow: hidden;
      }
      .tab:hover {
        background: var(--tab-hover);
      }
      .tab.active {
        background: var(--tab-active);
        color: #f1f5f9;
      }
      .tab.dragging {
        opacity: 0.45;
      }
      .tab .dot {
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0;
      }
      .tab.dirty .dot {
        opacity: 1;
      }
      .tab .title {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tab .close {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        line-height: 16px;
        text-align: center;
        border-radius: 4px;
        color: var(--fg-dim);
        opacity: 0.65;
        font-size: 14px;
      }
      .tab .close:hover {
        background: #475569;
        color: #fff;
        opacity: 1;
      }
      #add {
        flex: 0 0 auto;
        width: 30px;
        height: 34px;
        border: none;
        background: transparent;
        color: var(--fg-dim);
        font-size: 20px;
        line-height: 1;
        border-radius: 8px;
        cursor: default;
      }
      #add:hover {
        background: var(--tab-hover);
        color: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <div id="tabs"></div>
      <button id="add" title="Tab mới (mở tài liệu trống)">+</button>
    </div>
    <script src="shell.js"></script>
  </body>
</html>
