<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>ContractOCR — PDF Suite</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">📄 ContractOCR</div>

      <div class="group">
        <button id="btn-open" title="Mở PDF">Mở</button>
        <button id="btn-save" class="primary" disabled title="Lưu PDF (Ctrl+S)">Lưu</button>
      </div>

      <div class="sep"></div>

      <div class="group" data-needs-doc>
        <button id="btn-merge" disabled title="Ghép thêm PDF vào cuối">Ghép</button>
        <button id="btn-insert" disabled title="Chèn trang từ PDF khác sau trang đang chọn">Chèn</button>
        <button id="btn-extract" disabled title="Tách các trang đang chọn ra PDF mới">Tách</button>
      </div>

      <div class="sep"></div>

      <div class="group" data-needs-doc>
        <button id="btn-rotate-l" disabled title="Xoay trái 90°">⟲</button>
        <button id="btn-rotate-r" disabled title="Xoay phải 90°">⟳</button>
        <button id="btn-delete" disabled title="Xóa trang đang chọn">🗑</button>
      </div>

      <div class="sep"></div>

      <div class="group" data-needs-doc>
        <button id="btn-zoom-out" disabled title="Thu nhỏ">−</button>
        <span id="zoom-label" class="readout">100%</span>
        <button id="btn-zoom-in" disabled title="Phóng to">+</button>
      </div>

      <div class="spacer"></div>

      <button id="btn-ocr" class="ghost" disabled title="OCR trang hiện tại">OCR</button>
      <span id="sidecar-badge" class="badge starting" title="Trạng thái engine OCR">OCR: …</span>
    </header>

    <main class="workspace">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <span id="page-count">Chưa có tài liệu</span>
          <button id="btn-select-all" class="link" disabled>Chọn tất cả</button>
        </div>
        <div class="thumbs" id="thumbs"></div>
      </aside>

      <section class="viewer" id="viewer">
        <div class="empty" id="empty-state">
          <div class="empty-icon">📄</div>
          <h2>Mở một file PDF để bắt đầu</h2>
          <p>Kéo–thả file vào đây, hoặc bấm <b>Mở</b>.</p>
          <p class="hint">Xem · ghép · tách · chèn · xoay · xóa · sắp xếp lại trang — chạy hoàn toàn trên máy.</p>
        </div>
      </section>
    </main>

    <div class="ocr-panel" id="ocr-panel" hidden>
      <div class="ocr-head">
        <b>Kết quả OCR</b>
        <button id="ocr-close" class="link">Đóng</button>
      </div>
      <pre id="ocr-out"></pre>
    </div>

    <div class="toast" id="toast" hidden></div>
    <div class="overlay" id="overlay" hidden><div class="spinner"></div><span id="overlay-msg"></span></div>

    <!-- pdf-lib: UMD global `PDFLib`. pdf.js: UMD global `pdfjsLib`. Both vendored offline. -->
    <script src="vendor/pdf-lib.min.js"></script>
    <script src="vendor/pdf.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
