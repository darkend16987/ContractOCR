appId: com.nabupdf.app
productName: Nabu PDF
copyright: © 2026 Nabu PDF

# "Open with Nabu PDF" for .pdf files. The NSIS installer registers this handler
# in the Windows registry (adds Nabu PDF to the Open-with list; does NOT force it
# as the default viewer).
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF
    role: Viewer
    icon: build/icon.ico

directories:
  output: dist-app
  buildResources: build

# Only ship the Electron app source. The Python sidecar is added via extraResources.
files:
  - src/**/*
  - renderer/**/*
  - package.json

# PyInstaller onedir output (../dist/sidecar) → app's resources/sidecar at runtime.
# Run `npm run build:sidecar` first so this folder exists.
extraResources:
  - from: ../dist/sidecar
    to: sidecar
  # .NET signing helper (self-contained single-file exe) → resources/signing-helper.
  # Run `npm run build:helper` first so this folder exists.
  - from: dist-helper
    to: signing-helper
  # License notices shipped alongside the binary (AGPL/Apache/MIT/BSD require it).
  - from: ../LICENSE
    to: LICENSE.txt
  - from: ../THIRD-PARTY-LICENSES.txt
    to: THIRD-PARTY-LICENSES.txt

# Auto-update feed (electron-updater). Releases are published to GitHub
# Releases; the NSIS installer self-updates from there. See RELEASE.md.
publish:
  provider: github
  owner: darkend16987
  repo: NabuPDF

win:
  icon: build/icon.ico
  # --- Code signing (currently OFF — see SIGNING.md) -----------------------
  # Builds are UNSIGNED. Note what signing does and does NOT buy: NO certificate
  # type removes the SmartScreen warning on first download any more (Microsoft
  # dropped the EV fast-path). What it buys is reputation that CARRIES ACROSS
  # releases, the real publisher name instead of "Unknown publisher", and running
  # at all under Windows 11 Smart App Control. Full reasoning in SIGNING.md.
  #
  # (A) OV/EV cert (USB token or cloud HSM) — the viable route for a VN entity.
  #   Set env vars at build time; NO config block is needed:
  #     CSC_LINK=path\to\cert.pfx   CSC_KEY_PASSWORD=...   then `pnpm run build`.
  #   Cloud HSM providers ship their own signtool → use win.signtoolOptions.sign.
  #
  # (B) Azure Artifact Signing (formerly Trusted Signing, ~$10/mo).
  #   ⚠ NOT AVAILABLE to Vietnamese entities — Public Trust is limited to US/CA/EU/
  #   UK/AU/NZ/JP/KR/SG/CH/NO/IL (individuals: US/CA only). Kept here for the day
  #   there is an entity in a supported region.
  #   ⚠ There is NO `publisherName` field here — every unknown key is forwarded
  #   verbatim as a CLI arg to Invoke-TrustedSigning and breaks the signing call.
  #   ⚠ Auth is via EnvironmentCredential env vars (AZURE_TENANT_ID + AZURE_CLIENT_ID
  #   + a secret/cert/password), NOT `az login`.
  # azureSignOptions:
  #   endpoint: https://eus.codesigning.azure.net
  #   certificateProfileName: <profile>
  #   codeSigningAccountName: <account>
  target:
    - target: nsis       # standard installer (only build target — no portable)
  # Space-free file names (productName has a space) for clean download/OTA URLs.
  artifactName: NabuPDF-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  shortcutName: Nabu PDF
