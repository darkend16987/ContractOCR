<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Nabu PDF — Quản lý License</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <!-- Login -->
    <section id="login" class="login" hidden>
      <div class="card">
        <h1>Nabu PDF · License Admin</h1>
        <p class="muted">Chỉ superadmin. Đăng nhập bằng email đã được cấp quyền.</p>
        <input id="login-email" type="email" placeholder="email@cua-ban.com" autocomplete="email" />
        <input id="login-pass" type="password" placeholder="Mật khẩu (để trống nếu dùng magic link)" autocomplete="current-password" />
        <button id="login-pass-btn" class="primary">Đăng nhập bằng mật khẩu</button>
        <div class="login-or"><span>hoặc</span></div>
        <button id="login-send" class="ghost">Gửi magic link qua email</button>
        <p id="login-msg" class="muted small"></p>
      </div>
    </section>

    <!-- App -->
    <header id="topbar" class="topbar" hidden>
      <div class="topbar-container">
        <div class="brand">
          <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="3" width="22" height="26" rx="4" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="2"/>
            <path d="M27 10L20 3V7C20 8.65685 21.3431 10 23 10H27Z" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
            <g transform="translate(10, 14)">
              <path d="M0 1.5 L4 0.5 L4 2.5 Z" fill="var(--accent)"/>
              <path d="M0 5.5 L4 4.5 L4 6.5 Z" fill="var(--accent)"/>
              <path d="M2 0 L3.5 0 L2.5 8 Z" fill="var(--accent)"/>
              <path d="M5.5 2.5 L9 1 L8 4 Z" fill="var(--accent)"/>
            </g>
          </svg>
          <div>Nabu PDF <span class="badge">License</span></div>
        </div>
        
        <nav class="tabs">
          <button class="tab active" data-tab="licenses">Licenses</button>
          <button class="tab" data-tab="audit">Nhật ký</button>
          <button class="tab" data-tab="admins">Admins</button>
        </nav>
        
        <span class="spacer"></span>
        
        <div class="topbar-right">
          <span id="who" class="muted small"></span>
          <button id="signout" class="ghost">Đăng xuất</button>
        </div>
      </div>
    </header>

    <main id="app" hidden>
      <!-- Licenses tab -->
      <section id="tab-licenses" class="tabpane">
        <div class="toolbar">
          <div class="row filters">
            <select id="f-plan">
              <option value="">Tất cả gói</option>
              <option value="pro">Pro</option>
              <option value="doanh nghiệp">Doanh nghiệp</option>
            </select>
            <select id="f-seats">
              <option value="">Tất cả số máy</option>
              <option value="1-2">1 - 2 máy</option>
              <option value="3-10">3 - 10 máy</option>
              <option value="11+">&gt; 10 máy</option>
            </select>
            <select id="f-issued">
              <option value="">Tất cả ngày cấp</option>
              <option value="7">Trong 1 tuần qua</option>
              <option value="30">Trong 1 tháng qua</option>
              <option value="90">Trong 3 tháng qua</option>
              <option value="180">Trong 6 tháng qua</option>
              <option value="365">Trong 1 năm qua</option>
            </select>
            <select id="f-status">
              <option value="">Tất cả trạng thái</option>
              <option value="active">Active</option>
              <option value="expired">Expired</option>
              <option value="suspended">Suspended</option>
              <option value="revoked">Revoked</option>
            </select>
            <input id="search" type="search" placeholder="Tìm tên / email / key_id…" />
          </div>
          <div class="row actions">
            <button id="btn-new" class="primary">+ Cấp key mới</button>
            <button id="refresh" class="ghost" title="Tải lại">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
          </div>
        </div>
        <div class="table-container">
          <table class="grid">
            <thead>
              <tr>
                <th data-sort="key_id" class="sortable">Key ID <span></span></th>
                <th data-sort="name" class="sortable">Người dùng <span></span></th>
                <th data-sort="plan" class="sortable">Gói <span></span></th>
                <th data-sort="seats" class="sortable">Máy <span></span></th>
                <th data-sort="issued_at" class="sortable">Ngày cấp <span></span></th>
                <th data-sort="expires_at" class="sortable">Hạn <span></span></th>
                <th>Trạng thái</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="lic-rows"></tbody>
          </table>
        </div>
        <p id="lic-empty" class="muted" hidden>Chưa có license nào.</p>
      </section>

      <!-- Audit tab -->
      <section id="tab-audit" class="tabpane" hidden>
        <div class="table-container">
          <table class="grid">
            <thead><tr><th>Thời gian</th><th>Người làm</th><th>Hành động</th><th>Chi tiết</th></tr></thead>
            <tbody id="audit-rows"></tbody>
          </table>
        </div>
      </section>

      <!-- Admins tab -->
      <section id="tab-admins" class="tabpane" hidden>
        <div class="row">
          <input id="admin-email" type="email" placeholder="email admin mới…" />
          <button id="admin-add" class="primary">Thêm admin</button>
        </div>
        <div class="table-container">
          <table class="grid">
            <thead><tr><th>Email</th><th>Thêm lúc</th><th></th></tr></thead>
            <tbody id="admin-rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Issue / detail drawer -->
    <div id="drawer" class="drawer" hidden>
      <div class="drawer-card" id="drawer-body"></div>
    </div>
    
    <!-- Success Modal -->
    <div id="success-modal" class="drawer" style="align-items: center; justify-content: center;" hidden>
      <div class="card" style="width: 480px; max-width: 90vw; text-align: center; padding: 40px 32px;">
        <div style="width: 56px; height: 56px; background: var(--ok-bg); color: var(--ok); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h2 style="margin: 0 0 8px; font-size: 22px;">Cấp key thành công!</h2>
        <p class="muted" style="margin-bottom: 24px;">Key đã được copy tự động vào Clipboard.</p>
        <div class="keybox" id="success-key" style="margin-bottom: 24px;"></div>
        <button class="primary" id="success-close" style="width: 100%; padding: 12px;">Đóng & Hoàn tất</button>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="/admin/config.js"></script>
    <script src="/admin/app.js"></script>
  </body>
</html>
